<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eyes</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    #go { flex: 1; min-height: 40%; border: 0; font-size: 2rem; background: #0b5fff; color: #fff; }
    #go[aria-pressed="true"] { background: #1a7f37; }
    #go[data-state="error"] { background: #b42318; }
    #top { padding: .6rem .8rem; font-size: 1.1rem; background: #111; border-bottom: 1px solid #333; min-height: 3.2rem; }
    #badge { display: inline-block; padding: .1rem .55rem; border-radius: 1rem; font-weight: 700; margin-right: .5rem; background: #444; }
    #badge.listening { background: #1a7f37; } #badge.hearing { background: #0b5fff; }
    #badge.thinking { background: #9a6700; } #badge.speaking { background: #8250df; }
    #badge.error { background: #b42318; } #badge.connecting, #badge.starting { background: #6e7681; }
    #debug { font: 12px/1.35 ui-monospace, monospace; background: #0d1117; color: #c9d1d9; padding: .5rem .8rem; max-height: 38%; overflow: auto; }
    #debug table { border-collapse: collapse; width: 100%; }
    #debug td { padding: 1px 6px 1px 0; vertical-align: top; }
    #debug td:first-child { color: #8b949e; white-space: nowrap; width: 1%; }
    .ok { color: #7ee787; } .bad { color: #ff7b72; } .warn { color: #e3b341; }
    #meter { height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; margin: 2px 0 4px; }
    #meter > div { height: 100%; width: 0; background: #7ee787; transition: width .08s linear; }
    #log { margin-top: .4rem; border-top: 1px solid #30363d; padding-top: .3rem; color: #8b949e; white-space: pre-wrap; word-break: break-word; }
    #waitbar, #gatebar { display: flex; align-items: center; gap: .6rem; padding: .4rem .8rem; background: #161b22; font: 12px ui-monospace, monospace; color: #8b949e; }
    #gatebar span, #waitbar span { flex: 1; }
    #gatebar button, #waitbar button { width: 3rem; height: 2.2rem; font-size: 1.2rem; border: 1px solid #30363d; border-radius: 6px; background: #21262d; color: #fff; }
    #gatebar b, #waitbar b { color: #fff; min-width: 3.5rem; text-align: center; }
    video { display: none; }
  </style>
</head>
<body>
  <div id="top" aria-live="off"><span id="badge">idle</span><span id="status">Tap the button to start</span></div>
  <button id="go" aria-pressed="false" aria-label="Start assistant. Tap again to stop.">Tap to start</button>
  <div id="gatebar" class="bar" aria-hidden="true">
    <span>voice gate (higher = must speak louder)</span>
    <button id="gateDown" type="button">&minus;</button><b id="gateVal">0.030</b><button id="gateUp" type="button">+</button>
  </div>
  <div id="waitbar" class="bar" aria-hidden="true">
    <span>wait after you stop talking (applies on next start)</span>
    <button id="waitDown" type="button">&minus;</button><b id="waitVal">1200 ms</b><button id="waitUp" type="button">+</button>
  </div>
  <div id="debug" aria-hidden="true"></div>
  <video id="cam" playsinline muted></video>
  <canvas id="canvas" hidden></canvas>
  <script src="/static/app.js"></script>
</body>
</html>
