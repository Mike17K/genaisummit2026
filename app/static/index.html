<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eyes</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; }
    #go { width: 100%; height: 100%; border: 0; font-size: 2rem; background: #0b5fff; color: #fff; }
    #go[aria-pressed="true"] { background: #1a7f37; }
    video { display: none; }
    #status { position: fixed; top: 0; left: 0; right: 0; padding: .5rem; text-align: center; font-size: 1rem; }
  </style>
</head>
<body>
  <div id="status" role="status" aria-live="polite">Tap anywhere to start</div>
  <button id="go" aria-pressed="false" aria-label="Start assistant. Tap again to stop.">Tap to start</button>
  <video id="cam" playsinline muted></video>
  <canvas id="canvas" hidden></canvas>
  <script src="/static/app.js"></script>
</body>
</html>
