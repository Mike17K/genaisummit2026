<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eyes trace</title>
  <style>
    body { margin: 0; background: #0d1117; color: #e6edf3; font: 14px ui-monospace, monospace; }
    h1 { font-size: 1rem; margin: 0; padding: .75rem 1rem; border-bottom: 1px solid #30363d; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: .35rem 1rem; border-bottom: 1px solid #21262d; vertical-align: top; }
    .heard { color: #79c0ff; } .reply { color: #7ee787; } .tool { color: #d2a8ff; } .error { color: #ff7b72; }
    .meta { color: #8b949e; }
  </style>
</head>
<body>
  <h1>Eyes: live trace <span class="meta" id="count"></span></h1>
  <table><tbody id="rows"></tbody></table>
  <script>
    const rows = document.getElementById("rows");
    const fmt = (e) => {
      const { t, kind, ...rest } = e;
      const main = rest.text ?? rest.tool ?? rest.error ?? "";
      const meta = Object.entries(rest).filter(([k]) => k !== "text").map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join("  ");
      return `<tr class="${kind}"><td class="meta">${new Date(t * 1000).toLocaleTimeString()}</td><td>${kind}</td><td>${main === null ? "(silent)" : String(main).replace(/</g, "&lt;")}</td><td class="meta">${meta.replace(/</g, "&lt;")}</td></tr>`;
    };
    async function tick() {
      try {
        const events = await (await fetch("/trace")).json();
        rows.innerHTML = events.slice().reverse().map(fmt).join("");
        document.getElementById("count").textContent = `(${events.length} events)`;
      } catch (_) {}
    }
    tick(); setInterval(tick, 1000);
  </script>
</body>
</html>
