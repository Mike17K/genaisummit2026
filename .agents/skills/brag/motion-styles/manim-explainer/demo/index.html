<!doctype html><html><head><meta charset="utf-8"><title>Manim Explainer demo</title>
<link rel="stylesheet" href="../style.css">
<style>
/* demo layout only */
#t1 .big { left: 0; right: 0; top: 340px; text-align: center; font-size: 118px; }
#t1 .sub { left: 0; right: 0; top: 590px; text-align: center; }
#t2 .head { left: 120px; top: 90px; font-size: 64px; }
.ing { position: absolute; width: 124px; height: 124px; line-height: 124px; text-align: center; font: 500 26px/124px var(--mono); }
#t2 .rname { left: 1080px; top: 470px; font-size: 76px; width: 520px; text-align: center; }
#t2 .count { left: 1080px; top: 600px; width: 520px; text-align: center; font-size: 46px; }
#t2 .miss { left: 190px; top: 840px; font: 500 22px/1 var(--mono); color: var(--red); }
#t3 .head { left: 120px; top: 90px; font-size: 64px; }
#eq { left: 330px; top: 300px; }
#t3 .nl-t { font: 500 26px/1 var(--mono); color: var(--mute); width: 80px; text-align: center; }
#t4 .big { left: 0; right: 0; top: 400px; text-align: center; font-size: 132px; }
#t4 .sub { left: 0; right: 0; top: 640px; text-align: center; }
</style></head><body>
<div id="stage" class="ms-manim-explainer">
  <section class="scene" id="t1"><div class="world">
    <h1 class="mx-text big">What can you cook tonight?</h1>
    <svg class="mx"><path id="ul1" class="mx-stroke blue" d="M 300 520 C 700 540, 1200 500, 1620 522"/></svg>
    <div class="mx-text mono sub">pantry / recipe matching</div>
  </div></section>

  <section class="scene" id="t2"><div class="world">
    <h2 class="mx-text head">Match the fridge to the recipe</h2>
    <svg class="mx" id="svg2">
      <circle id="c1" class="mx-stroke blue mx-fill-blue" cx="300" cy="320" r="62"/>
      <circle id="c2" class="mx-stroke blue mx-fill-blue" cx="300" cy="500" r="62"/>
      <circle id="c3" class="mx-stroke blue mx-fill-blue" cx="300" cy="680" r="62"/>
      <path id="c4" class="mx-stroke red" stroke-dasharray="14 14" d="M 238 860 a 62 62 0 1 0 124 0 a 62 62 0 1 0 -124 0 Z"/>
      <path id="a1" class="mx-stroke" d="M 366 320 C 650 320, 760 470, 1040 520"/>
      <path id="a2" class="mx-stroke" d="M 366 500 C 650 500, 760 540, 1040 540"/>
      <path id="a3" class="mx-stroke" d="M 366 680 C 650 680, 760 600, 1040 560"/>
      <path id="a4" class="mx-stroke red" stroke-dasharray="14 14" d="M 366 860 C 650 860, 800 640, 1040 580"/>
      <rect id="box" class="mx-stroke green mx-fill-green" x="1040" y="400" width="600" height="330" rx="28"/>
    </svg>
    <div class="ing" style="left:238px;top:258px">egg</div>
    <div class="ing" style="left:238px;top:438px">feta</div>
    <div class="ing" style="left:238px;top:618px;font-size:22px">spinach</div>
    <div class="ing c-red" style="left:238px;top:798px">dill</div>
    <div class="mx-text rname">Spinach pie</div>
    <div class="mx-text count"><span class="c-yellow">3</span> <span class="c-mute">of</span> <span class="c-blue">4</span> <span class="c-mute">on hand</span></div>
  </div></section>

  <section class="scene" id="t3"><div class="world">
    <h2 class="mx-text head">So the recipe scores</h2>
    <div class="mx-eq" id="eq">
      <span id="e1">score</span><span id="e2">=</span>
      <span class="mx-frac" id="e3"><span class="c-green">matched</span><i class="c-mute"></i><span class="c-blue">needed</span></span>
      <span id="e4">=</span>
      <span class="mx-frac" id="e5"><span class="c-green">3</span><i></i><span class="c-blue">4</span></span>
      <span id="e6">=</span><span class="c-yellow" id="e7">0.75</span>
    </div>
    <svg class="mx" id="svg3">
      <line id="nl" class="mx-stroke" x1="360" y1="800" x2="1560" y2="800" style="stroke-width:4"/>
      <path class="mx-stroke" id="tk" style="stroke-width:4" d="M360 780V820M660 786V814M960 780V820M1260 786V814M1560 780V820"/>
      <path id="brace" class="mx-stroke yellow" style="stroke-width:4" d="M 360 850 Q 360 874 384 874 L 1236 874 Q 1260 874 1260 850"/>
    </svg>
    <div class="nl-t mx-label" style="left:320px;top:836px;color:var(--mute)" id="n0">0</div>
    <div class="nl-t mx-label" style="left:1520px;top:836px;color:var(--mute)" id="n1">1</div>
    <div class="mx-label c-yellow" id="dotl" style="left:1070px;top:894px;width:340px;font-size:28px">good match</div>
    <svg class="mx"><circle id="dot" cx="360" cy="800" r="19" fill="#FFE45C"/></svg>
  </div></section>

  <section class="scene" id="t4"><div class="world">
    <h1 class="mx-text big">Cook what you <span class="c-green">have</span>.</h1>
    <svg class="mx"><path id="ul4" class="mx-stroke green" d="M 560 590 C 800 606, 1100 580, 1360 596"/></svg>
    <div class="mx-text mono sub">pantry</div>
  </div></section>
</div>
<script>window.TIMELINE = { width: 1920, height: 1080, fps: 30, duration: 10 };</script>
<script src="../../../runtime/gsap.js"></script><script src="../../../runtime/timeline.js"></script><script src="../../../runtime/motion.js"></script>
<script src="../kit.js"></script>
<script>
BRAG.build((tl, fx) => {
  const S = BRAG.styles['manim-explainer'];
  const planes = ['#t1', '#t2', '#t3', '#t4'].map((s, i) => S.plane(s + ' .world', { axes: i !== 1, step: 120 }));
  fx.scenes([
    { el: '#t1', start: 0,   end: 2.5, out: 'fade', outDur: 0.5 },
    { el: '#t2', start: 2.5, end: 6.1, out: 'fade', outDur: 0.5 },
    { el: '#t3', start: 6.1, end: 8.7, out: 'fade', outDur: 0.5 },
    { el: '#t4', start: 8.7, end: 10 },
  ]);
  // 1: title written, underline created
  S.planeIn(planes[0], 0.0, { dur: 1.0 });
  S.write('#t1 .big', 0.3, { dur: 1.2 });
  S.create('#ul1', 1.5, { dur: 0.7 });
  S.fadeIn('#t1 .sub', 1.8, { y: 14 });
  S.camera('#t1 .world', 0.2, { scale: 1.04, dur: 2.2 });
  // 2: ingredients, arrows, recipe
  S.planeIn(planes[1], 2.5, { dur: 0.8 });
  S.write('#t2 .head', 2.6, { dur: 0.8 });
  S.create(['#c1', '#c2', '#c3', '#c4'], 3.1, { dur: 0.6, stagger: 0.12 });
  S.fadeIn('#t2 .ing', 3.3, { y: 10, dur: 0.5, stagger: 0.12 });
  S.create(['#a1', '#a2', '#a3', '#a4'], 3.7, { dur: 0.8, stagger: 0.12 });
  S.create('#box', 4.2, { dur: 0.9 });
  S.fillIn('#box', 4.9, { dur: 0.4 });
  S.write('#t2 .rname', 4.6, { dur: 0.6 });
  S.fadeIn('#t2 .count', 5.2, { y: 12 });
  S.indicate('#t2 .count .c-yellow', 5.4, { scale: 1.3, dur: 0.6, back: '#FFE45C', flash: false });
  S.camera('#t2 .world', 2.7, { scale: 1.03, dur: 3.4 });
  // 3: the maths
  S.planeIn(planes[2], 6.1, { dur: 0.8 });
  S.write('#t3 .head', 6.2, { dur: 0.8 });
  S.write('#e1', 6.6, { dur: 0.3 });
  S.fadeIn('#e2', 6.8, { y: 0, dur: 0.3 });
  S.fadeIn('#e3', 6.9, { y: 18, dur: 0.5 });
  S.fadeIn('#e4', 7.2, { y: 0, dur: 0.3 });
  S.fadeIn('#e5', 7.3, { y: 18, dur: 0.5 });
  S.fadeIn('#e6', 7.6, { y: 0, dur: 0.3 });
  S.write('#e7', 7.7, { dur: 0.4 });
  S.create(['#nl', '#tk'], 6.9, { dur: 0.9 });
  S.fadeIn('#n0, #n1', 7.5, { y: 8, dur: 0.4 });
  S.slide('#dot', 0, 900, 7.3, { dur: 0.7 });
  S.create('#brace', 7.95, { dur: 0.4 });
  S.fadeIn('#dotl', 8.15, { y: 8, dur: 0.3 });
  S.indicate('#e7', 8.0, { scale: 1.15, dur: 0.5, back: '#FFE45C' });
  S.morph('#c4', 'M 240 802 L 360 802 L 360 922 L 240 922 Z', 5.45, { dur: 0.8 });   // Transform: the missing item becomes a card for the shopping list
  // 4: close
  S.planeIn(planes[3], 8.7, { dur: 0.6 });
  S.write('#t4 .big', 8.85, { dur: 0.8 });
  S.create('#ul4', 9.4, { dur: 0.5 });
  S.fadeIn('#t4 .sub', 9.5, { y: 10 });
});
</script></body></html>
